name: Build and release

# Builds the sdist and wheel of PyVideoKit-Libs, PyVideoKit-CLI, PyVideoKit-GUI
# (packages/) and the PyVideoKit meta-package, checks them with twine, installs
# the local wheels on every supported Python and runs each package's
# scripts/smoke_test.py against real FFmpeg, FFprobe and SoX (the GUI headless,
# Qt offscreen). It also installs them on Windows and macOS.
#
# "Run workflow" with a version (e.g. 0.4.4, matching every pyproject.toml and
# arch/PKGBUILD) also tags v<version>, publishes one GitHub release with all
# packages, uploads the four packages to PyPI (Trusted Publishing, environment
# "pypi") and pushes arch/PKGBUILD to the "pyvideokit" AUR package base (needs
# the AUR_SSH_PRIVATE_KEY secret). Leave the version empty to only build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.4.4). Leave empty to only build.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# The JavaScript actions below run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Keep the workflow visible to required checks; only relevant jobs run.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.filter.outputs.checks }}
      metadata: ${{ steps.filter.outputs.metadata }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: filter
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_FILTERS: |
            {
              "checks": {
                "include": [
                  "packages/**",
                  "pyproject.toml",
                  "Makefile",
                  ".github/workflows/release.yaml"
                ],
                "exclude": [
                  "**/*.md",
                  "**/LICENSE*"
                ]
              },
              "metadata": {
                "include": [
                  "README.md",
                  "LICENSE",
                  "arch/**",
                  "packages/**/README.md",
                  "packages/**/LICENSE*"
                ],
                "exclude": []
              }
            }
        run: |
          import fnmatch
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args])

          filters = json.loads(os.environ['CHANGE_FILTERS'])
          event = json.loads(open(os.environ['GITHUB_EVENT_PATH']).read())
          event_name = os.environ['EVENT_NAME']
          force = event_name in ('workflow_dispatch', 'schedule')
          paths = []
          if not force:
              if event_name == 'pull_request':
                  base = event['pull_request']['base']['sha']
                  head = event['pull_request']['head']['sha']
              else:
                  base, head = event['before'], event['after']
              if not all(re.fullmatch(r'[0-9a-fA-F]{40,64}', sha) for sha in (base, head)):
                  raise SystemExit('Invalid Git object ID in event')
              available = base.strip('0') and subprocess.run(
                  ['git', 'cat-file', '-e', base + '^{commit}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not available:
                  # Initial/force pushes can omit the old commit. Validate everything safely.
                  force = True
              else:
                  if event_name == 'pull_request':
                      base = git('merge-base', base, head).decode().strip()
                  paths = git('diff', '--no-renames', '--name-only', '-z', base, head).decode().split('\0')
                  paths = [path for path in paths if path]

          def matches(path, patterns):
              # fnmatch's * includes /; a leading **/ also matches root-level files.
              return any(fnmatch.fnmatchcase(path, pattern) or (
                  pattern.startswith('**/') and fnmatch.fnmatchcase(path, pattern[3:])
              ) for pattern in patterns)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, patterns in filters.items():
                  selected = force or any(
                      matches(path, patterns['include']) and not matches(path, patterns.get('exclude', []))
                      for path in paths
                  )
                  value = str(selected).lower()
                  print(f'{name}={value}', file=output)
                  print(f'{name}: {value}')

  build:
    needs: [changes]
    if: (needs.changes.outputs.checks == 'true' || needs.changes.outputs.metadata == 'true')
    name: Build packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version like 0.4.4, without the v."
            exit 1
          fi

          python - <<'EOF'
          import os, re, sys, tomllib

          wanted = os.environ["VERSION"]
          found = {}
          for path in (".", "packages/libs", "packages/cli", "packages/gui"):
              with open(f"{path}/pyproject.toml", "rb") as f:
                  project = tomllib.load(f)["project"]
              found[project["name"]] = project["version"]
          with open("arch/PKGBUILD") as f:
              found["arch/PKGBUILD"] = re.search(r"^pkgver=(\S+)", f.read(), re.M).group(1)

          for name, version in found.items():
              print(f"{name:16} {version}")

          versions = set(found.values())
          if len(versions) != 1:
              print("::error::Versions differ between packages. Bump them all to the same version first.")
              sys.exit(1)
          if wanted and versions != {wanted}:
              print(f"::error::Packages say {versions.pop()}. Bump them all to {wanted} first.")
              sys.exit(1)
          EOF

      - name: Build sdists and wheels
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          for dir in packages/libs packages/cli packages/gui .; do
            python -m build --outdir dist "$dir"
          done
          python -m twine check --strict dist/*
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: PyVideoKit-dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: [changes, build]
    if: needs.changes.outputs.checks == 'true'
    name: Smoke test (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The runner's Azure mirror sometimes crawls. Keep the downloaded .debs
      # in the Actions cache so only a cold run depends on the mirror.
      - name: Restore apt package cache
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-sox-qt-ubuntu-24.04-v1

      # Cap each attempt and, before retrying, point the runner's mirror list
      # (apt-mirrors.txt, not ubuntu.sources) at the main Ubuntu archive.
      - name: Install FFmpeg, SoX and Qt runtime libraries
        run: |
          if compgen -G ~/apt-debs/'*.deb' > /dev/null; then
            sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/
          fi
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update \
              && timeout 300 sudo apt-get install --no-install-recommends -y \
                -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                -o APT::Keep-Downloaded-Packages=true ffmpeg sox \
                libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3; then
              mkdir -p ~/apt-debs
              cp /var/cache/apt/archives/*.deb ~/apt-debs/
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed, switching to archive.ubuntu.com"
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
              /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          done
          exit 1

      - name: Save apt package cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-sox-qt-ubuntu-24.04-v1

      - uses: actions/download-artifact@v8
        with:
          name: PyVideoKit-dist
          path: dist

      # All four wheels at once, so pip takes PyVideoKit-Libs from dist/ and
      # never from PyPI (where this version may not exist yet).
      - name: Install the wheels
        run: python -m pip install dist/*.whl

      # Run from a scratch directory so Python imports the installed wheels,
      # not the src trees.
      - name: Run smoke tests
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for pkg in libs cli gui; do
            echo "::group::$pkg"
            python -I "$GITHUB_WORKSPACE/packages/$pkg/scripts/smoke_test.py"
            echo "::endgroup::"
          done

  verify:
    needs: [changes, build]
    if: needs.changes.outputs.checks == 'true'
    name: Install test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8
        with:
          name: PyVideoKit-dist
          path: dist

      - name: Install wheels
        run: python -m pip install dist/*.whl

      - name: Smoke test
        run: |
          set -euo pipefail
          pvk --version
          pvk --help
          for cmd in apply-vhs-effect concat-videos convert-to-ffv1 extract-audio fade-video prepare-youtube trim-video; do
            "$cmd" --help > /dev/null
          done
          python - <<'EOF'
          import pyvideokit_libs
          from PySide6.QtWidgets import QApplication
          from pyvideokit_gui._main_window import MainWindow

          print("PyVideoKit-Libs", pyvideokit_libs.__version__)
          app = QApplication([])
          window = MainWindow()
          window.show()
          app.processEvents()
          window.close()
          EOF

  release:
    name: Publish release
    needs: [build, smoke, verify]
    if: github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: pyvideokit-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check tag
        run: |
          set -euo pipefail
          # An API failure must stop the release, so no "|| true" here.
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[].ref' > tags.txt
          if grep -Fxq "refs/tags/v$VERSION" tags.txt; then
            echo "::error::Tag v$VERSION already exists. Use another version."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: PyVideoKit-dist
          path: release-assets

      - name: Check packages and generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          for name in pyvideokit pyvideokit_libs pyvideokit_cli pyvideokit_gui; do
            for file in "$name-$VERSION.tar.gz" "$name-$VERSION-py3-none-any.whl"; do
              if [[ ! -s "$file" ]]; then
                echo "::error::Package $file is missing or empty."
                exit 1
              fi
            done
          done
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create tag and publish release
        working-directory: release-assets
        run: |
          set -euo pipefail
          {
            echo "Install everything with \`pip install PyVideoKit\` from PyPI, \`pip install *.whl\` from this release, or \`yay -S python-pyvideokit\` on Arch Linux."
            echo "FFmpeg, FFprobe and SoX must be available in your \`PATH\`."
          } > notes.md
          gh release create "v$VERSION" *.whl *.tar.gz SHA256SUMS.txt \
            --target "$RELEASE_SHA" \
            --title "PyVideoKit v$VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --latest

  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/PyVideoKit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PyVideoKit-dist
          path: dist

      # All four projects in one upload. No API token: each PyPI project
      # (PyVideoKit, -Libs, -CLI, -GUI) must trust this workflow and environment.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  aur:
    name: Update AUR package
    needs: release
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Check AUR key
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::Add the AUR_SSH_PRIVATE_KEY secret to update the AUR package."
            exit 1
          fi

      # Inside a container HOME is /github/home but ssh looks up ~/.ssh from
      # /etc/passwd (/root), so pass the key and host keys explicitly.
      - name: Set up SSH and git
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git openssh
          ssh_dir="$RUNNER_TEMP/aur-ssh"
          install -dm700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/aur"
          chmod 600 "$ssh_dir/aur"
          # Pinned AUR host keys, see https://aur.archlinux.org
          cat > "$ssh_dir/known_hosts" << 'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          EOF
          echo "GIT_SSH_COMMAND=ssh -i $ssh_dir/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          git config --global user.name "Evilchuck666"
          git config --global user.email "carlos.martinez.medina1992@gmail.com"

      - uses: actions/checkout@v7
        with:
          path: repo
          persist-credentials: false

      # arch/PKGBUILD in this repository is the source of truth: copy it over
      # the AUR one and regenerate .SRCINFO. makepkg refuses to run as root.
      - name: Push PKGBUILD to the AUR
        run: |
          set -euo pipefail
          git clone ssh://aur@aur.archlinux.org/pyvideokit.git aur
          cp repo/arch/PKGBUILD aur/PKGBUILD
          useradd -m builder
          chown -R builder aur
          cd aur
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          git config --global --add safe.directory "$PWD"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package is already at $VERSION."
            exit 0
          fi
          git commit -m "Update to $VERSION"
          git push origin master

  result:
    name: CI result
    if: always()
    needs: [changes, build, smoke, verify, release, pypi, aur]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] in ('failure', 'cancelled')]
          if results['changes']['result'] != 'success':
              failed.append('changes')
          if failed:
              raise SystemExit('Unsuccessful jobs: ' + ', '.join(sorted(set(failed))))
          print('All relevant jobs passed; unrelated jobs were skipped.')
