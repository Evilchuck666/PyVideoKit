[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyVideoKit"
version = "0.4.3"
description = "FFmpeg-based video toolkit: installs PyVideoKit-Libs, the pvk CLI and the PySide6 GUI for trimming, fades, VHS effects, FFV1 masters and 4K ProRes exports"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Evilchuck666", email = "carlos.martinez.medina1992@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyVideoKit-Libs>=0.4.3",
    "PyVideoKit-CLI>=0.4.3",
    "PyVideoKit-GUI>=0.4.3",
]
keywords = ["ffmpeg", "video", "video-processing", "cli", "gui", "ffv1", "prores", "vhs", "youtube"]

[project.urls]
Homepage = "https://github.com/Evilchuck666/PyVideoKit"
Source = "https://github.com/Evilchuck666/PyVideoKit"
Issues = "https://github.com/Evilchuck666/PyVideoKit/issues"
Releases = "https://github.com/Evilchuck666/PyVideoKit/releases"

[tool.setuptools]
packages = []
